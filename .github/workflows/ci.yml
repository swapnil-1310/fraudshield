name: CI Pipeline

on:
  push:
    branches: [ main, "chore/**", "feat/**", "fix/**" ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test & Lint (CPU)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1

      - name: Install Python Dependencies (CPU Mode)
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-base.txt
          pip install -r requirements-dev.txt
          pip install moviepy timm facenet-pytorch soundfile androguard faster-whisper easyocr

      - name: Lint with Ruff (Non-blocking)
        continue-on-error: true
        run: |
          ruff check .

      - name: Run Characterization Test Suite
        run: |
          pytest

      - name: Run Audit Hardcoded Thresholds
        run: |
          python scripts/audit_hardcoded.py

  security:
    name: Security & Secret Scan (Non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Dependency Vulnerability Audit (pip-audit)
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit -r requirements-base.txt

      - name: Run Gitleaks Secret Detector
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
