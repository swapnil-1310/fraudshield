audio:
  chunk_duration_seconds: 5.0
  consensus_min_chunks: 2
  consensus_top_weight: 0.65
audio_detector:
  backend: wav2vec2_garystafford
  github_model_id: garystafford/wav2vec2-deepfake-voice-detector
  github_model_revision: c66306024a7ede0be291e9c4558b37634782dc4
  model_id: MelodyMachine/Deepfake-Audio-Detection-V2
backup_apis:
  enable_cloud_fallback: false
  sightengine:
    enabled: false
    fake_score_threshold: 0.5
    models: deepfake,genai
hardware:
  device: cuda
  force_cpu: false
metadata:
  detect_provenance: true
  enabled: true
  timeout_seconds: 10
  use_exiftool: true
  use_ffprobe: true
pipeline:
  stage1_ingest:
    audio_sample_rate: 16000
    face_crop_margin_px: 25
    face_detector_model: MTCNN
    max_frames_to_extract: 25
    min_frames_floor: 15
  stage2_vision:
    model_id: AdityaManojShinde/deepfake-detector
    model_weights_file: deepfake_detector_phase2.pth
    use_cpu: false
  stage3_audio:
    backend: wav2vec2_garystafford
    model_id: garystafford/wav2vec2-deepfake-voice-detector
    use_cpu: false
  stage4_transcription:
    compute_type: float16
    model_id: Systran/faster-whisper-small
    use_cpu: false
  stage5_llm:
    api_url: http://localhost:11434/api/chat
    model_id: llama3.1:latest
    timeout_long_sec: 180.0
    timeout_short_sec: 90.0
  stage6_registry:
    refresh_interval_hours: 24
    source: static_data/sebi_registry.json
  stage9_apk_domain:
    apk_whitelist: static_data/broker_apk_whitelist.json
    dangerous_permissions:
    - READ_SMS
    - RECEIVE_SMS
    - READ_CONTACTS
    - BIND_ACCESSIBILITY_SERVICE
    - PACKAGE_USAGE_STATS
server:
  max_upload_mb: 100
  preload_models: false
thresholds:
  apk_domain_levenshtein_max_dist: 3
  audio_fake_threshold: 0.5
  audio_segment_flag_threshold: 0.45
  impersonation_audio_threshold: 0.45
  llm_risk_auto_flag_threshold: 0.45
  ocr_min_confidence: 0.15
  registry_name_number_match_score: 65
  registry_name_only_match_score: 80
  scam_composite_threshold: 0.35
  scene_cut_threshold: 35.0
  sebi_risk_threshold: 0.7
  vision_fake_threshold: 0.5
vision:
  consensus_min_frames: 3
  consensus_top_weight: 0.65
  early_exit_frame_count: 4
  early_exit_score: 0.92
vision_detector:
  backend: ms_eff_gcvit
  # Active Detector: Original pretrained checkpoint (KoreaPeter/ms-eff-gcvit-deepfake-b0-ff-plus-plus)
  # Loaded directly from Hugging Face Hub (model.safetensors) when model_weights_file is null.
  # Retained Experimental Baseline / Rollback:
  # To rollback to the FaceForensics++ c23 fine-tuned checkpoint, restore:
  # model_weights_file: experiments/deepfake_finetune/checkpoints/best_checkpoint_weights.pth
  model_weights_file: null
  threshold: 0.6
