[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -m "not slow" -v --tb=short
markers =
    slow: marks tests as slow-running or model-heavy (deselected by default)
    xfail: marks tests expected to fail due to documented existing quirks
filterwarnings =
    ignore::DeprecationWarning
    ignore::ResourceWarning
